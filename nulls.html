<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@300;400;500;600&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-nulls.css">
</head>
<body>

<div class="scanlines"></div>

<header>
  <a class="logo" href="#">
    <span class="logo-text" data-text="BLINK">BLINK</span>
    <span class="logo-fm">fm</span>
  </a>
  <div class="header-right">
    <span class="live-counter vt" id="liveCounter">▶ 00:00</span>
    <div class="rec-badge">
      <span class="rec-dot"></span>
      <span class="vt">REC</span>
    </div>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-tabs">
        <button class="stab active" data-tab="playlist">playlist <span class="stab-count vt" id="trackCount"></span></button>
        <button class="stab" data-tab="pending">pending <span class="stab-count vt" id="pendingCount"></span></button>
      </div>
      <button class="sidebar-add" id="submitBtn" title="Submit a song">+</button>
    </div>
    <div class="tab-pane active" id="pane-playlist">
      <div class="playlist" id="playlist">
        <div class="playlist-empty">
          <p class="vt empty-big">NO SIGNAL</p>
          <p class="empty-sub">no songs loaded yet</p>
        </div>
      </div>
    </div>
    <div class="tab-pane" id="pane-pending">
      <div class="pending-list" id="pendingList">
        <div class="playlist-empty">
          <p class="vt empty-big">EMPTY</p>
          <p class="empty-sub">no submissions yet.<br>be the first.</p>
        </div>
      </div>
    </div>
  </aside>

  <main class="player">

    <div class="cover-area">
      <div class="cover-frame" id="coverFrame">
        <img class="cover-img" id="coverImg" src="" alt="">
        <div class="cover-placeholder" id="coverPlaceholder">
          <div class="ph-noise"></div>
          <span class="vt ph-text">NO TAPE</span>
        </div>
        <div class="cover-vignette"></div>
        <div class="tracking-line"></div>
      </div>
      <div class="eq" id="eq">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </div>
    </div>

    <div class="track-info">
      <p class="now-label vt">// NOW PLAYING</p>
      <div class="track-title-wrap">
        <h2 class="track-title" id="trackTitle">nothing yet</h2>
      </div>
      <p class="track-artist" id="trackArtist">pick something from the tape</p>
    </div>

    <div class="seek-row">
      <span class="time vt" id="timeNow">0:00</span>
      <div class="seek-bar">
        <div class="seek-fill" id="seekFill"></div>
        <input class="seek-input" id="seekInput" type="range" min="0" max="100" value="0" step="0.05">
      </div>
      <span class="time vt" id="timeTotal">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnShuffle" title="Shuffle">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
      <button class="ctrl-btn" id="btnPrev" title="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="btnPlay" title="Play">
        <svg class="ico-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ico-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" id="btnNext" title="Next">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="btnRepeat" title="Repeat">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>

    <div class="vol-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="vol-icon"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
      <input class="vol-slider" id="volSlider" type="range" min="0" max="1" step="0.01" value="0.8">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" class="vol-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    </div>

  </main>
</div>

<footer class="site-footer">
  <a class="theme-switch" href="index.html">← VHS theme</a>
  <a class="powered-null" href="https://nulls.chat" target="_blank" rel="noopener">
    <span class="pn-by">powered by</span>
    <span class="pn-name">null</span>
  </a>
</footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title vt">// SUBMIT A SONG</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <p class="modal-note">5 upvotes and it goes live on the tape</p>
    <input class="modal-input" type="text" id="subTitle" placeholder="song title" maxlength="100">
    <input class="modal-input" type="text" id="subArtist" placeholder="artist" maxlength="100">
    <input class="modal-input" type="url" id="subUrl" placeholder="direct audio url (.mp3, .ogg, .wav)" maxlength="500">
    <button class="modal-btn" id="subConfirm">drop it →</button>
    <p class="modal-msg" id="subMsg"></p>
  </div>
</div>

<audio id="audio"></audio>
<script src="songs.js"></script>
<script src="app.js"></script>
<script src="submit.js"></script>
</body>
</html>
